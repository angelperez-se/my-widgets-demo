<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="widget-name" content="Liga de Ruta - Leaderboard de gamificacion por equipo">
<meta name="widget-description" content="Leaderboard gamificado de repartidores/ruteros por porcentaje de meta de ventas, con podio top-3, filtro por equipo (El Globo vs Ruta Bimbo) e indicadores de cambio de posicion semanal. Datos ficticios para demo.">
<title>Liga de Ruta</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

  .lb-outer { max-width: 440px; margin: 0 auto; padding: 10px; }

  .lb-card {
    background: #ffffff; border-radius: 18px; overflow: hidden;
    box-shadow: 0 4px 24px rgba(20,30,70,.12);
  }

  /* Header */
  .lb-header {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #2b3f8f 0%, #1b285c 100%);
    padding: 22px 20px 20px; color: #fff; text-align: center;
  }
  .lb-decor-a { position: absolute; top: -40px; right: -30px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,196,0,.20); }
  .lb-decor-b { position: absolute; bottom: -50px; left: -30px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.06); }
  .lb-eyebrow { position: relative; z-index: 1; font-size: 11px; font-weight: 700; color: rgba(255,255,255,.7); letter-spacing: .3px; margin: 0 0 6px; }
  .lb-title { position: relative; z-index: 1; font-size: 22px; font-weight: 800; margin: 0 0 4px; }
  .lb-subtitle { position: relative; z-index: 1; font-size: 12.5px; color: rgba(255,255,255,.8); margin: 0; }

  /* Tabs */
  .lb-tabs { display: flex; gap: 6px; padding: 14px 16px 4px; }
  .lb-tab {
    flex: 1; border: none; background: #F2F3F8; color: #5b5f6b;
    font-size: 12px; font-weight: 700; font-family: inherit;
    padding: 8px 6px; border-radius: 8px; cursor: pointer; transition: all .15s ease;
    white-space: nowrap;
  }
  .lb-tab.active { background: #263576; color: #fff; }

  /* Podio */
  .lb-podium { display: flex; align-items: flex-end; gap: 8px; padding: 20px 18px 6px; }
  .lb-podium-slot { flex: 1; text-align: center; }
  .lb-podium-avatar {
    width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; color: #fff; position: relative;
  }
  .lb-podium-slot.gold .lb-podium-avatar { width: 64px; height: 64px; font-size: 19px; box-shadow: 0 0 0 3px #FFD54A, 0 4px 14px rgba(255,180,0,.4); }
  .lb-podium-slot.silver .lb-podium-avatar { box-shadow: 0 0 0 3px #D9DEE6, 0 4px 10px rgba(0,0,0,.12); }
  .lb-podium-slot.bronze .lb-podium-avatar { box-shadow: 0 0 0 3px #E3B08C, 0 4px 10px rgba(0,0,0,.12); }
  .lb-medal { position: absolute; top: -8px; right: -4px; font-size: 18px; }
  .lb-podium-name { font-size: 12px; font-weight: 700; color: #1a1a1a; line-height: 1.25; margin: 0 0 2px; }
  .lb-podium-team { font-size: 10px; margin-bottom: 4px; }
  .lb-podium-pct { font-size: 15px; font-weight: 800; }
  .lb-podium-base { height: 10px; border-radius: 6px 6px 0 0; margin-top: 8px; }
  .lb-podium-slot.gold .lb-podium-base { height: 22px; background: linear-gradient(180deg,#FFD54A,#F5A623); }
  .lb-podium-slot.silver .lb-podium-base { height: 14px; background: linear-gradient(180deg,#E3E7EE,#C7CCD6); }
  .lb-podium-slot.bronze .lb-podium-base { height: 10px; background: linear-gradient(180deg,#E9C2A0,#D6A374); }

  /* Lista */
  .lb-list { padding: 6px 14px 18px; }
  .lb-row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #F2F3F5; }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank-wrap { width: 26px; text-align: center; flex-shrink: 0; }
  .lb-rank { font-size: 13px; font-weight: 800; color: #8890a0; }
  .lb-delta { font-size: 9.5px; font-weight: 700; display: block; margin-top: 1px; }
  .lb-delta.up { color: #1FA55C; }
  .lb-delta.down { color: #ED1C24; }
  .lb-delta.same { color: #C1C4CE; }

  .lb-avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; color: #fff;
  }

  .lb-row-body { flex: 1; min-width: 0; }
  .lb-row-name-line { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
  .lb-row-name { font-size: 13px; font-weight: 700; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-team-badge { font-size: 9.5px; font-weight: 700; padding: 1px 7px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
  .lb-track { height: 7px; background: #EDEEF2; border-radius: 4px; overflow: hidden; }
  .lb-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }

  .lb-pct-wrap { flex-shrink: 0; text-align: right; width: 46px; }
  .lb-pct { font-size: 13px; font-weight: 800; }
  .lb-flame { font-size: 10px; }

  .lb-hidden { display: none !important; }

  /* "Eres tú" */
  .lb-jump-row { padding: 4px 16px 2px; text-align: center; }
  .lb-jump-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: #EFF3FF; color: #263576; border: none; border-radius: 20px;
    padding: 6px 14px; font-size: 11.5px; font-weight: 700; font-family: inherit;
    cursor: pointer;
  }
  .lb-row-you { background: #EFF3FF; border-radius: 10px; margin: 0 -4px; padding: 10px 8px; border-bottom: none !important; }
  .lb-row-you + .lb-row { border-top: 1px solid #F2F3F5; }
  .lb-you-badge {
    font-size: 9px; font-weight: 800; color: #263576; background: #dbe3fb;
    padding: 1px 6px; border-radius: 8px; flex-shrink: 0;
  }
  .lb-podium-slot.is-you .lb-podium-avatar { box-shadow: 0 0 0 3px #263576, 0 0 0 6px #dbe3fb; }
</style>
</head>
<body>

<div class="lb-outer">
  <div class="lb-card">

    <div class="lb-header">
      <div class="lb-decor-a"></div>
      <div class="lb-decor-b"></div>
      <p class="lb-eyebrow" id="lb-week">🏆 Semana del —</p>
      <h1 class="lb-title">Liga de Ruta</h1>
      <p class="lb-subtitle">Ranking semanal por % de meta cumplida</p>
    </div>

    <div class="lb-tabs">
      <button class="lb-tab active" data-team="all" id="lb-tab-all" onclick="setTeamFilter('all', this)">Todos</button>
      <button class="lb-tab" data-team="globo" onclick="setTeamFilter('globo', this)">🎈 El Globo</button>
      <button class="lb-tab" data-team="bimbo" onclick="setTeamFilter('bimbo', this)">🍞 Ruta Bimbo</button>
    </div>

    <div class="lb-jump-row">
      <button class="lb-jump-btn" onclick="scrollToMe()">📍 Ver mi posición</button>
    </div>

    <div class="lb-podium" id="lb-podium"></div>
    <div class="lb-list" id="lb-list"></div>

  </div>
</div>

<script>
  // ── Demo conceptual: datos ficticios en memoria, nada se envía ni se guarda.
  const TEAMS = {
    globo: { label: 'El Globo', emoji: '🎈', badgeBg: '#FCEFE4', badgeText: '#B23A3A', avatarGrad: 'linear-gradient(135deg,#D14B4B,#E5786B)' },
    bimbo: { label: 'Ruta Bimbo', emoji: '🍞', badgeBg: '#EFF1FA', badgeText: '#263576', avatarGrad: 'linear-gradient(135deg,#263576,#3a4f9e)' }
  };

  // name, team, pct de meta, delta = cambio de posicion vs semana pasada (+ sube, - baja, 0 igual)
  const DATA = [
    { name: 'Roberto Salazar',      team: 'bimbo', pct: 128, delta: 1  },
    { name: 'Diana Reyes',          team: 'globo', pct: 121, delta: 3  },
    { name: 'Marco Antonio Pérez',  team: 'bimbo', pct: 115, delta: -1 },
    { name: 'Fernanda Islas',       team: 'globo', pct: 109, delta: 2  },
    { name: 'Jorge Luis Camacho',   team: 'bimbo', pct: 104, delta: 0  },
    { name: 'Alejandra Núñez',      team: 'globo', pct: 98,  delta: -2 },
    { name: 'Iván Contreras',       team: 'bimbo', pct: 95,  delta: 1  },
    { name: 'Paola Medina',         team: 'globo', pct: 91,  delta: -1 },
    { name: 'Sergio Aguilar',       team: 'bimbo', pct: 87,  delta: 4  },
    { name: 'Alejandra González',   team: 'bimbo', pct: 84,  delta: 1,  isYou: true },
    { name: 'Karla Rentería',       team: 'globo', pct: 82,  delta: 0  },
    { name: 'Héctor Bautista',      team: 'bimbo', pct: 76,  delta: -3 },
    { name: 'Lucía Marín',          team: 'globo', pct: 70,  delta: -2 }
  ];

  let currentFilter = 'all';

  function initials(name) {
    const parts = name.split(' ').filter(Boolean);
    return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase();
  }

  function tierColor(pct) {
    if (pct >= 110) return '#1FA55C';
    if (pct >= 90) return '#2E9E4F';
    if (pct >= 70) return '#F5A623';
    return '#ED1C24';
  }

  function deltaHtml(delta) {
    if (delta > 0) return '<span class="lb-delta up">▲' + delta + '</span>';
    if (delta < 0) return '<span class="lb-delta down">▼' + Math.abs(delta) + '</span>';
    return '<span class="lb-delta same">—</span>';
  }

  function scrollToMe() {
    if (currentFilter !== 'all') {
      setTeamFilter('all', document.getElementById('lb-tab-all'));
    }
    setTimeout(() => {
      const el = document.getElementById('lb-you-row');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
  }

  function setTeamFilter(team, btnEl) {
    currentFilter = team;
    document.querySelectorAll('.lb-tab').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
    render();
  }

  function render() {
    const filtered = DATA
      .filter(p => currentFilter === 'all' || p.team === currentFilter)
      .slice()
      .sort((a, b) => b.pct - a.pct);

    const podiumEl = document.getElementById('lb-podium');
    const listEl = document.getElementById('lb-list');
    podiumEl.innerHTML = '';
    listEl.innerHTML = '';

    const top3 = filtered.slice(0, 3);
    const rest = filtered.slice(3);

    // Orden visual del podio: plata (2do) - oro (1ro) - bronce (3ro)
    const order = [top3[1], top3[0], top3[2]];
    const classes = ['silver', 'gold', 'bronze'];
    const medals = ['🥈', '🥇', '🥉'];

    order.forEach((p, i) => {
      if (!p) return;
      const t = TEAMS[p.team];
      const slot = document.createElement('div');
      slot.className = 'lb-podium-slot ' + classes[i] + (p.isYou ? ' is-you' : '');
      if (p.isYou) slot.id = 'lb-you-row';
      slot.innerHTML =
        '<div class="lb-podium-avatar" style="background:' + t.avatarGrad + '">' +
          initials(p.name) +
          '<span class="lb-medal">' + medals[i] + '</span>' +
        '</div>' +
        '<p class="lb-podium-name">' + p.name.split(' ').slice(0, 2).join(' ') + (p.isYou ? ' 📍' : '') + '</p>' +
        '<div class="lb-podium-team" style="color:' + t.badgeText + '">' + t.emoji + ' ' + t.label + '</div>' +
        '<div class="lb-podium-pct" style="color:' + tierColor(p.pct) + '">' + p.pct + '%</div>' +
        '<div class="lb-podium-base"></div>';
      podiumEl.appendChild(slot);
    });

    rest.forEach((p, idx) => {
      const t = TEAMS[p.team];
      const rank = idx + 4;
      const row = document.createElement('div');
      row.className = 'lb-row' + (p.isYou ? ' lb-row-you' : '');
      if (p.isYou) row.id = 'lb-you-row';
      row.innerHTML =
        '<div class="lb-rank-wrap"><span class="lb-rank">' + rank + '</span>' + deltaHtml(p.delta) + '</div>' +
        '<div class="lb-avatar" style="background:' + t.avatarGrad + '">' + initials(p.name) + '</div>' +
        '<div class="lb-row-body">' +
          '<div class="lb-row-name-line">' +
            '<span class="lb-row-name">' + p.name + '</span>' +
            (p.isYou ? '<span class="lb-you-badge">Tú</span>' : '') +
            '<span class="lb-team-badge" style="background:' + t.badgeBg + ';color:' + t.badgeText + '">' + t.emoji + '</span>' +
          '</div>' +
          '<div class="lb-track"><div class="lb-fill" style="width:' + Math.min(p.pct, 100) + '%;background:' + tierColor(p.pct) + '"></div></div>' +
        '</div>' +
        '<div class="lb-pct-wrap">' +
          '<div class="lb-pct" style="color:' + tierColor(p.pct) + '">' + p.pct + '%</div>' +
          (p.pct >= 100 ? '<div class="lb-flame">🔥 meta</div>' : '') +
        '</div>';
      listEl.appendChild(row);
    });

    reportHeight();
  }

  // Semana actual (siempre calculada al momento, no hardcodeada)
  (function setWeekLabel() {
    const now = new Date();
    const day = now.getDay();
    const diffToMonday = day === 0 ? -6 : 1 - day;
    const monday = new Date(now);
    monday.setDate(now.getDate() + diffToMonday);
    const label = new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'long' }).format(monday);
    document.getElementById('lb-week').textContent = '🏆 Semana del ' + label;
  })();

  // Reporta altura al padre (Staffbase) cuando cambia el filtro.
  function reportHeight() {
    window.parent.postMessage({ type: 'resize', height: document.body.scrollHeight }, '*');
  }
  new ResizeObserver(reportHeight).observe(document.body);
  window.addEventListener('load', () => { render(); reportHeight(); });
</script>

</body>
</html>
