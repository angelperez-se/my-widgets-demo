<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="widget-name" content="Onboarding Checklist">
<meta name="widget-description" content="Day-1 onboarding task checklist. The Cornerstone training task opens an inline embedded view (no real navigation) instead of relying on /openlink/, which is currently not staying in-app on mobile. Other internal Staffbase links still use /openlink/.">
<meta name="widget-tags" content="HR Onboarding">
<title>Onboarding Checklist</title>
<style>
:root {
  --primary:      var(--sb-brand, #2563eb);
  --primary-soft: rgba(37,99,235,0.10);
  --success:      #10b981;
  --success-soft: #ecfdf5;
  --warning:      #f59e0b;
  --warning-soft: #fffbeb;
  --text:         #1f2937;
  --text-light:   #6b7280;
  --bg:           transparent;
  --bg-card:      #ffffff;
  --bg-gray:      #f9fafb;
  --border:       #e5e7eb;
  --radius:       14px;
  --radius-sm:    9px;
  --shadow:       0 1px 4px rgba(0,0,0,0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary:      var(--sb-brand, #3b9eff);
    --primary-soft: rgba(59,158,255,0.15);
    --success:      #34d399;
    --success-soft: #0b1f19;
    --warning:      #fbbf24;
    --warning-soft: #1c1307;
    --text:         #f3f4f6;
    --text-light:   #9ca3af;
    --bg-card:      #1f2937;
    --bg-gray:      #111827;
    --border:       #374151;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 16px;
  -webkit-font-smoothing: antialiased;
}
.cw-widget { width: 100%; max-width: 520px; margin: 0 auto; }

/* Header */
.cw-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.cw-hdr-icon { width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cw-hdr-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cw-title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.cw-subtitle { font-size: 13px; color: var(--text-light); margin: 0 0 14px 42px; }

/* Progress */
.cw-prog-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--text-light); margin-bottom: 6px; }
.cw-prog-track { height: 7px; background: var(--bg-gray); border: 1px solid var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
.cw-prog-fill { height: 100%; background: var(--primary); border-radius: 99px; transition: width 0.4s ease; }

/* Task list card */
.cw-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px 16px 12px; margin-bottom: 10px; }

/* Task item */
.cw-task { padding: 14px 0; border-bottom: 1px solid var(--border); }
.cw-task:last-child { border-bottom: none; padding-bottom: 0; }
.cw-task:first-child { padding-top: 8px; }

.cw-task-top { display: flex; align-items: flex-start; gap: 12px; }
.cw-task.is-done .cw-task-label { color: var(--text-light); text-decoration: line-through; font-weight: 500; }

.cw-checkbox {
  width: 24px; height: 24px; flex-shrink: 0;
  border: 2px solid var(--border);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .1s;
  margin-top: 1px;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.cw-checkbox.done { background: var(--success); border-color: var(--success); }
.cw-checkbox.done svg { opacity: 1; }
.cw-checkbox svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .15s; }
.cw-task-body { flex: 1; min-width: 0; }

.cw-task-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.cw-task-label { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.35; flex: 1; }
.cw-task-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; flex-shrink: 0; white-space: nowrap; }
.cw-task-badge.required  { background: rgba(239,68,68,0.1); color: #dc2626; }
.cw-task-badge.optional  { background: var(--bg-gray); color: var(--text-light); border: 1px solid var(--border); }
.cw-task-badge.career    { background: rgba(139,92,246,0.1); color: #7c3aed; }

.cw-task-desc { font-size: 12px; color: var(--text-light); margin-top: 3px; line-height: 1.5; }

/* Link button */
.cw-task-action { margin-top: 10px; }
.cw-link-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--primary);
  background: var(--primary-soft);
  color: var(--primary);
  font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  text-decoration: none;
  transition: background .15s, border-color .15s;
  -webkit-tap-highlight-color: transparent;
}
.cw-link-btn:hover { background: var(--primary); color: #fff; }
.cw-link-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* Done banner */
.cw-done-banner {
  display: none; align-items: center; gap: 10px;
  background: var(--success-soft); color: var(--success);
  border-radius: var(--radius-sm); padding: 12px 14px;
  font-size: 13px; font-weight: 700; margin-top: 4px;
}
.cw-done-banner.show { display: flex; }
.cw-done-banner svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* Reset */
.cw-reset-row { text-align: center; margin-top: 8px; }
.cw-reset-btn { background: none; border: none; color: var(--text-light); font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; padding: 4px 8px; border-radius: 6px; }
.cw-reset-btn:hover { color: var(--primary); background: var(--primary-soft); }

/* ── Fake "opening" transition ─────────────────────────────────────────── */
#cw-fake-loading {
  display: none;
  position: fixed; inset: 0;
  background: var(--bg-card);
  z-index: 9998;
  flex-direction: column; align-items: center; justify-content: center; gap: 14px;
}
#cw-fake-loading .cw-spinner {
  width: 30px; height: 30px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: cw-spin .7s linear infinite;
}
@keyframes cw-spin { to { transform: rotate(360deg); } }
#cw-fake-loading span { font-size: 13px; color: var(--text-light); font-weight: 600; }

/* ── Inline embedded Cornerstone overlay ──────────────────────────────── */
#cw-cornerstone-overlay {
  display: none;
  position: fixed; inset: 0;
  z-index: 9999;
  background: #e0e0e0;
}
#cw-cornerstone-back {
  position: absolute; top: 10px; left: 10px; z-index: 2;
  background: rgba(0,0,0,0.55); color: #fff; border: none;
  border-radius: 20px; padding: 7px 14px;
  font-size: 12.5px; font-weight: 700; font-family: inherit;
  cursor: pointer;
}
#cw-cornerstone-iframe { width: 100%; height: 100%; border: none; display: block; }
</style>
</head>
<body>
<div class="cw-widget" id="cw-widget-root">

  <div class="cw-hdr">
    <div class="cw-hdr-icon">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    </div>
    <span class="cw-title" id="widget-title">Onboarding Checklist</span>
  </div>
  <p class="cw-subtitle" id="widget-sub">Complete all tasks to finish your onboarding journey.</p>

  <div class="cw-prog-row">
    <span id="prog-text">0 of 5 completed</span>
    <span id="prog-pct">0%</span>
  </div>
  <div class="cw-prog-track"><div class="cw-prog-fill" id="prog-fill" style="width:0%"></div></div>

  <div class="cw-card" id="task-list"></div>

  <div class="cw-done-banner" id="done-banner">
    <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    <span id="done-text">All tasks complete — great work!</span>
  </div>
  <div class="cw-reset-row"><button class="cw-reset-btn" id="reset-btn" onclick="resetAll()"></button></div>

</div>

<!-- Fake "opening" transition shown briefly before revealing the inline Cornerstone view -->
<div id="cw-fake-loading">
  <div class="cw-spinner"></div>
  <span id="cw-fake-loading-text">Opening...</span>
</div>

<!-- Inline Cornerstone overlay: an iframe whose srcdoc is loaded from the hidden
     textarea below. No real navigation happens, so the /openlink/ issue never
     comes into play for this task. -->
<div id="cw-cornerstone-overlay">
  <button id="cw-cornerstone-back" onclick="closeCornerstoneInline()">← Back</button>
  <iframe id="cw-cornerstone-iframe" title="Cornerstone"></iframe>
</div>

<!-- Raw HTML for the Cornerstone mockup, kept in a hidden <textarea> (not a
     <script> tag) specifically because the Cornerstone document contains its
     own </script> closing tag, which would otherwise prematurely terminate a
     wrapping <script> block. <textarea> has no such collision. -->
<textarea id="cw-cornerstone-src" readonly tabindex="-1" aria-hidden="true" style="position:absolute; width:0; height:0; opacity:0; pointer-events:none;"><!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integración de aprendizaje Cornerstone</title>
    <style>
        :root {
            --primary-purple: #5D2E8E;
            --primary-purple-light: #F3EFFF;
            --text-dark: #1F1F1F;
            --text-grey: #666666;
            --bg-light: #F8F9FA;
            --white: #FFFFFF;
            --border-radius: 12px;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile Container Simulation */
        .app-container {
            width: 375px;
            height: 812px;
            background-color: var(--white);
            border-radius: 0;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 44px 20px 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--white);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .brand-icon {
            width: 24px;
            height: 24px;
            background-color: var(--primary-purple);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        .user-actions {
            display: flex;
            gap: 12px;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #ddd;
            background-image: url('https://i.pravatar.cc/100?img=5');
            background-size: cover;
        }

        /* Tabs */
        .tabs {
            display: flex;
            padding: 0 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 16px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 0;
            margin-right: 24px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-grey);
            cursor: pointer;
            position: relative;
        }

        .tab-btn.active {
            color: var(--text-dark);
            font-weight: 600;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--text-dark);
        }

        /* Scrollable Content */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 20px 20px;
            scrollbar-width: none;
        }

        .content-area::-webkit-scrollbar { display: none; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
        }

        .filter-btn {
            font-size: 12px;
            color: var(--text-grey);
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        /* Course Grid */
        .course-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .course-card {
            background: var(--white);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .course-card:hover {
            transform: translateY(-2px);
        }

        .card-img-wrap {
            height: 100px;
            width: 100%;
            background-color: #eee;
            border-radius: 8px;
            margin-bottom: 8px;
            position: relative;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            color: white;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }

        .status-required { background: rgba(30, 30, 30, 0.8); }
        .status-inprogress { background: rgba(255, 140, 0, 0.9); }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            font-size: 11px;
            color: var(--text-grey);
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 2px;
        }

        .card-due {
            font-size: 11px;
            color: var(--text-grey);
        }

        /* Modal / Detail View */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-content {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 92%;
            background: var(--white);
            border-radius: 20px 20px 0 0;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 101;
            display: flex;
            flex-direction: column;
        }

        .modal-active .modal-overlay { opacity: 1; pointer-events: auto; }
        .modal-active .modal-content { transform: translateY(0); }

        .modal-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-grey);
        }

        .modal-scroll {
            overflow-y: auto;
            padding: 0 20px 100px 20px;
            flex: 1;
        }

        .hero-img {
            width: 100%;
            height: 180px;
            background: #eee;
            border-radius: 12px;
            margin-bottom: 20px;
            object-fit: cover;
        }

        .detail-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .detail-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--text-grey);
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid #eee;
        }

        .detail-desc-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .detail-desc {
            font-size: 14px;
            color: var(--text-grey);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .detail-desc ul {
            padding-left: 20px;
            margin-top: 8px;
        }

        .cta-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 20px;
            background: var(--white);
            border-top: 1px solid #eee;
        }

        .cta-btn {
            width: 100%;
            background-color: var(--primary-purple);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .cta-btn:disabled { opacity: .5; cursor: not-allowed; }

        /* Bimbo Market: acordeones nativos con <details>, sin JS */
        #screen-market summary { list-style: none; cursor: pointer; outline: none; }
        #screen-market summary::-webkit-details-marker { display: none; }
        #screen-market summary::marker { content: ""; }
        #screen-market details[open] > .reveal { animation: bimboReveal .35s ease; }
        @keyframes bimboReveal { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
        #screen-market .chev, #screen-market .plus { transition: transform .3s ease; display: inline-block; }
        #screen-market details[open] .chev { transform: rotate(180deg); }
        #screen-market details[open] .plus { transform: rotate(45deg); }
        #screen-market { animation: marketSlideIn .32s ease-out; }
        @keyframes marketSlideIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: translateX(0); } }
        #screen-courses.reentering { animation: coursesSlideIn .28s ease-out; }
        @keyframes coursesSlideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

        svg { width: 24px; height: 24px; fill: #999; }
        .purple-fill { fill: var(--primary-purple); }
    </style>
</head>
<body>

                <span>Cornerstone</span>
            </div>

          <div style="width:100%; margin:0 auto; background:#F2F2F2;">

            <!-- HEADER -->

              <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; position: relative; z-index: 1;">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span style="color: #ffffff; font-size: 20px; font-weight: 800; letter-spacing: -0.5px;">Bimbo</span>
                  <span style="background: #ED1C24; color: #ffffff; font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 4px; letter-spacing: 0.06em;">MARKET</span>
                </div>
                <div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; position: relative;"><span style="position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; background: #FF3340; border-radius: 50%; border: 1.5px solid #263576;"></span></div>

            html += `</div>`;
            return html;

            const text = document.getElementById('loto-progress-text');
            let pct = 0;
            const interval = setInterval(() => {
                pct += 20;
                fill.style.width = pct + '%';
                text.textContent = pct + '% completado';
                if (pct >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('loto-complete-panel').style.display = 'block';
                        document.getElementById('cta-container').style.display = 'none';
                    }, 400);

                ctaContainer.style.display = 'none';

            document.body.classList.remove('modal-active');

            document.getElementById('screen-market').style.display = 'none';
            const courses = document.getElementById('screen-courses');
            courses.style.display = 'flex';
            courses.classList.remove('reentering');

            reportHeight();

        // Le avisa a Staffbase qué tan alto es este widget, para que el iframe
        // no se quede recortado en una altura más chica que la del mockup fijo.
        function reportHeight() {
            window.parent.postMessage({ type: 'resize', height: document.body.scrollHeight }, '*');
        }
        new ResizeObserver(reportHeight).observe(document.body);
        window.addEventListener('load', reportHeight);
    </script>

const t = T[LANG] ?? T['en-US'];
function tr(s, v) { if (!s) return ''; if (v) Object.keys(v).forEach(k => { s = s.replaceAll('{' + k + '}', v[k]); }); return s; }

// ── applySBBrand ──────────────────────────────────────────────────────────
function applySBBrand() {
  const sb = getComputedStyle(document.documentElement).getPropertyValue('--sb-brand').trim();
  if (sb) { document.documentElement.style.setProperty('--primary', sb); return; }
  try {
    const sb2 = window.parent.getComputedStyle(window.parent.document.documentElement).getPropertyValue('--sb-brand').trim();
    if (sb2) document.documentElement.style.setProperty('--primary', sb2);
  } catch(e) {}
}

// ── State ─────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'onboarding-checklist/v1';
let state = (() => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; } })();
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }
function toggle(id) { state[id] = !state[id]; saveState(); render(); }
window.resetAll = function() { state = {}; saveState(); render(); };

// ── Icons ─────────────────────────────────────────────────────────────────
const CHECK_SVG = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`;
const LINK_SVG  = `<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

const TASK_ICONS = {
  t1: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>`,
  t2: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>`,
  t3: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
  t4: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>`,
  t5: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
};

const ICON_COLORS = {
  required: 'rgba(37,99,235,0.12)',
  optional:  'rgba(245,158,11,0.12)',
  career:    'rgba(139,92,246,0.12)',
};
const ICON_TEXT_COLORS = {
  required: 'var(--primary)',
  optional:  'var(--warning)',
  career:    '#7c3aed',
};

// ── Render ────────────────────────────────────────────────────────────────
function render() {
  const tasks = t.tasks;
  const done  = tasks.filter(tk => state[tk.id]).length;
  const total = tasks.length;
  const pct   = Math.round((done / total) * 100);

  // Progress
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-text').textContent = tr(t.progress, { done, total });
  document.getElementById('prog-pct').textContent  = pct + '%';

  // All done banner
  document.getElementById('done-banner').classList.toggle('show', done === total);

  // Task list
  document.getElementById('task-list').innerHTML = tasks.map(tk => {
    const isDone = !!state[tk.id];
    const badgeLabel = t[tk.badge] || tk.badge;
    const action = tk.inline ? `openCornerstoneInline()` : (tk.external ? `sbOpenExternal('${tk.url}')` : `sbOpenLink('${tk.url}')`);
    return `
      <div class="cw-task${isDone ? ' is-done' : ''}">
        <div class="cw-task-top">
          <div class="cw-checkbox${isDone ? ' done' : ''}" data-id="${tk.id}" role="checkbox" tabindex="0" aria-checked="${isDone}">
            ${CHECK_SVG}
          </div>
          <div class="cw-task-body">
            <div class="cw-task-meta">
              <span class="cw-task-label">${tk.label}</span>
              <span class="cw-task-badge ${tk.badge}">${badgeLabel}</span>
            </div>
            <div class="cw-task-desc">${tk.desc}</div>
            <div class="cw-task-action">
              <button class="cw-link-btn" onclick="${action}">
                <span style="display:inline-flex;width:22px;height:22px;border-radius:6px;background:${ICON_COLORS[tk.badge]};color:${ICON_TEXT_COLORS[tk.badge]};align-items:center;justify-content:center;flex-shrink:0;">${TASK_ICONS[tk.id]}</span>
                ${t.openTask}
                ${LINK_SVG}
              </button>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  // Wire checkbox clicks — full row tap area
  document.querySelectorAll('.cw-checkbox').forEach(box => {
    const handler = () => toggle(box.dataset.id);
    box.addEventListener('click', handler);
    box.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); handler(); } });
  });
}

// ── In-app navigation (still used for t2-t5) ─────────────────────────────
window.sbOpenLink = function(url) {
  var sdk = window['plugins-client-sdk'];
  if (sdk && sdk.openLink) {
    sdk.openLink(url).catch(function() {
      try { window.top.location.href = url; } catch(e) { location.href = url; }
    });
  } else {
    try { window.top.location.href = url; } catch(e) { location.href = url; }
  }
};

window.sbOpenExternal = function(url) {
  window.open(url, '_blank', 'noopener');
};

// ── Inline Cornerstone (no real navigation at all) ───────────────────────
// Shows a brief fake "opening" transition, then loads the Cornerstone HTML
// (pulled from the hidden <textarea>) into an iframe's srcdoc and reveals it
// as a full-screen overlay. "← Back" just hides the overlay again.
window.openCornerstoneInline = function() {
  const fake = document.getElementById('cw-fake-loading');
  document.getElementById('cw-fake-loading-text').textContent = t.openingText;
  fake.style.display = 'flex';
  reportHeight();

  setTimeout(function() {
    fake.style.display = 'none';
    const overlay = document.getElementById('cw-cornerstone-overlay');
    const iframe = document.getElementById('cw-cornerstone-iframe');
    if (iframe.getAttribute('data-loaded') !== 'true') {
      iframe.srcdoc = document.getElementById('cw-cornerstone-src').value;
      iframe.setAttribute('data-loaded', 'true');
    }
    overlay.style.display = 'block';
    reportHeight();
  }, 550);
};

window.closeCornerstoneInline = function() {
  document.getElementById('cw-cornerstone-overlay').style.display = 'none';
  reportHeight();
};

function applyText() {
  document.getElementById('widget-title').textContent = t.title;
  document.getElementById('widget-sub').textContent   = t.sub;
  document.getElementById('done-text').textContent    = t.allDone;
  document.getElementById('reset-btn').textContent    = t.reset;
}

// ── Height reporting ──────────────────────────────────────────────────────
function reportHeight() {
  const h = Math.max(
    document.getElementById('cw-widget-root').scrollHeight,
    document.getElementById('cw-cornerstone-overlay').style.display === 'block' ? 850 : 0,
    document.getElementById('cw-fake-loading').style.display === 'flex' ? 300 : 0
  );
  if (window.parent !== window) {
    try { window.parent.postMessage({ type: 'setHeight', height: h }, '*'); } catch (e) {}
  }
}

// ── Init ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  applySBBrand();
  applyText();
  render();
  reportHeight();
});

})();
</script>
