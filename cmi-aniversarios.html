<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="widget-name" content="CMI - Cumpleaños y Aniversarios del mes (web, dos columnas)">
<meta name="widget-description" content="Version web/escritorio del widget de cumpleanos y aniversarios laborales del mes, con el look and feel de CMI (naranja). Ancho doble mostrando ambas listas en columnas lado a lado en vez de pestanas, aprovechando el espacio de escritorio. Cumpleanos en orden cronologico, Aniversarios ranqueados por anos de antiguedad con distintivo en anos milestone. Datos ficticios para demo.">
<title>Cumpleaños y Aniversarios</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

  .ca-outer { max-width: 880px; margin: 0 auto; padding: 10px; }

  .ca-card { background: #ffffff; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 24px rgba(20,30,70,.12); }

  .ca-header { position: relative; overflow: hidden; background: linear-gradient(135deg, #E8720C 0%, #B85B00 100%); padding: 22px 26px 20px; color: #fff; text-align: center; }
  .ca-decor-a { position: absolute; top: -40px; right: -30px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.14); }
  .ca-decor-b { position: absolute; bottom: -50px; left: -30px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.06); }
  .ca-eyebrow { position: relative; z-index: 1; font-size: 11px; font-weight: 700; color: rgba(255,255,255,.75); letter-spacing: .3px; margin: 0 0 6px; text-transform: uppercase; }
  .ca-title { position: relative; z-index: 1; font-size: 22px; font-weight: 800; margin: 0 0 4px; }
  .ca-subtitle { position: relative; z-index: 1; font-size: 13px; color: rgba(255,255,255,.85); margin: 0; line-height: 1.5; }

  /* Columnas lado a lado */
  .ca-columns { display: flex; }
  .ca-col { flex: 1; min-width: 0; padding: 18px 20px 20px; }
  .ca-col + .ca-col { border-left: 1px solid #F0F1F4; }
  .ca-col-title { font-size: 13px; font-weight: 800; color: #1a1a2e; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

  /* Lista */
  .ca-list { display: flex; flex-direction: column; }
  .ca-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid #F2F3F5; }
  .ca-row:last-child { border-bottom: none; }
  .ca-rank { width: 18px; text-align: center; font-size: 11.5px; font-weight: 800; color: #C1C4CE; flex-shrink: 0; }
  .ca-avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #fff; }
  .ca-row-body { flex: 1; min-width: 0; }
  .ca-row-name-line { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
  .ca-row-name { font-size: 13px; font-weight: 700; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ca-row-meta { font-size: 11.5px; color: #8890a0; }
  .ca-right { flex-shrink: 0; text-align: right; }
  .ca-years { font-size: 14.5px; font-weight: 800; color: #E8720C; }
  .ca-years-label { font-size: 9.5px; color: #8890a0; font-weight: 600; }
  .ca-milestone { display: inline-block; margin-top: 3px; font-size: 9.5px; font-weight: 800; color: #B8860B; background: #FFF6DE; padding: 2px 7px; border-radius: 8px; }

  .ca-row-you { background: #FDEEE0; border-radius: 10px; margin: 0 -4px; padding: 10px 6px; border-bottom: none !important; }
  .ca-row-you + .ca-row { border-top: 1px solid #F2F3F5; }
  .ca-you-badge { font-size: 9px; font-weight: 800; color: #B85B00; background: #FBDFC0; padding: 1px 6px; border-radius: 8px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="ca-outer">

  <div class="ca-card">

    <div class="ca-header">
      <div class="ca-decor-a"></div>
      <div class="ca-decor-b"></div>
      <p class="ca-eyebrow" id="ca-month-label">📅 —</p>
      <h1 class="ca-title">Así celebramos este mes</h1>
      <p class="ca-subtitle">Cumpleaños y aniversarios laborales de nuestro equipo</p>
    </div>

    <div class="ca-columns">
      <div class="ca-col">
        <div class="ca-col-title">🎂 Cumpleaños</div>
        <div class="ca-list" id="ca-list-bday"></div>
      </div>
      <div class="ca-col">
        <div class="ca-col-title">🏅 Aniversarios</div>
        <div class="ca-list" id="ca-list-anniv"></div>
      </div>
    </div>

  </div>

</div>

<script>
  // ── Demo conceptual: datos ficticios en memoria, nada se envía ni se guarda.
  const AVATAR_GRAD = 'linear-gradient(135deg,#E8720C,#FFA94D)';

  // Cumpleaños: day = día del mes (se muestra junto al mes actual real)
  const BIRTHDAYS = [
    { name: 'Renata Salcido',      day: 3  },
    { name: 'Emilio Torres',       day: 6  },
    { name: 'Ximena Delgado',      day: 9  },
    { name: 'Uriel Castañeda',     day: 12 },
    { name: 'Daniela Ochoa',       day: 15 },
    { name: 'Rodrigo Villaseñor',  day: 19 },
    { name: 'Alejandra González',  day: new Date().getDate(), isYou: true },
    { name: 'Mariana Cabrera',     day: 24 },
    { name: 'Andrés Figueroa',     day: 28 }
  ].sort((a, b) => a.day - b.day);

  // Aniversarios: years = años de antigüedad. Milestone: múltiplos de 5, o el primer año.
  const ANNIVERSARIES = [
    { name: 'Guillermo Peña',        years: 15 },
    { name: 'Leticia Armendáriz',    years: 12 },
    { name: 'Salvador Nieto',        years: 10 },
    { name: 'Itzel Cordero',         years: 8  },
    { name: 'Adrián Zamudio',        years: 5  },
    { name: 'Brenda Solórzano',      years: 3  },
    { name: 'Tomás Herrera',         years: 2  },
    { name: 'Valeria Junco',         years: 1  }
  ].sort((a, b) => b.years - a.years);

  function isMilestone(years) { return years === 1 || years % 5 === 0; }

  function initials(name) {
    const parts = name.split(' ').filter(Boolean);
    return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase();
  }

  function render() {
    const bdayEl = document.getElementById('ca-list-bday');
    const annivEl = document.getElementById('ca-list-anniv');
    bdayEl.innerHTML = '';
    annivEl.innerHTML = '';

    const monthName = new Intl.DateTimeFormat('es-MX', { month: 'long' }).format(new Date());

    BIRTHDAYS.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = 'ca-row' + (p.isYou ? ' ca-row-you' : '');
      row.innerHTML =
        '<div class="ca-rank">' + (idx + 1) + '</div>' +
        '<div class="ca-avatar" style="background:' + AVATAR_GRAD + '">' + initials(p.name) + '</div>' +
        '<div class="ca-row-body">' +
          '<div class="ca-row-name-line">' +
            '<span class="ca-row-name">' + p.name + '</span>' +
            (p.isYou ? '<span class="ca-you-badge">Tú</span>' : '') +
          '</div>' +
          '<div class="ca-row-meta">🎂 ' + p.day + ' de ' + monthName + '</div>' +
        '</div>';
      bdayEl.appendChild(row);
    });

    ANNIVERSARIES.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = 'ca-row' + (p.isYou ? ' ca-row-you' : '');
      row.innerHTML =
        '<div class="ca-rank">' + (idx + 1) + '</div>' +
        '<div class="ca-avatar" style="background:' + AVATAR_GRAD + '">' + initials(p.name) + '</div>' +
        '<div class="ca-row-body">' +
          '<div class="ca-row-name-line">' +
            '<span class="ca-row-name">' + p.name + '</span>' +
            (p.isYou ? '<span class="ca-you-badge">Tú</span>' : '') +
          '</div>' +
          (isMilestone(p.years) ? '<span class="ca-milestone">🏅 Aniversario especial</span>' : '') +
        '</div>' +
        '<div class="ca-right">' +
          '<div class="ca-years">' + p.years + '</div>' +
          '<div class="ca-years-label">' + (p.years === 1 ? 'año' : 'años') + '</div>' +
        '</div>';
      annivEl.appendChild(row);
    });

    reportHeight();
  }

  (function setMonthLabel() {
    const monthName = new Intl.DateTimeFormat('es-MX', { month: 'long' }).format(new Date());
    document.getElementById('ca-month-label').textContent = '📅 ' + monthName.charAt(0).toUpperCase() + monthName.slice(1);
  })();

  function reportHeight() {
    window.parent.postMessage({ type: 'resize', height: document.body.scrollHeight }, '*');
  }
  new ResizeObserver(reportHeight).observe(document.body);
  window.addEventListener('load', () => { render(); reportHeight(); });
</script>

</body>
</html>
