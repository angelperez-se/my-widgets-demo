<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Obteniendo ubicación...</title>
</head>
<body style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; text-align:center; padding-top:70px; color:#5b6572; background:#F7F9FA;">
  <p style="font-size:15px;">📍 Obteniendo tu ubicación...</p>
  <p style="font-size:12px; color:#8890a0;">Esta ventana se cierra sola en un momento.</p>

  <script>
    // Este archivo vive fuera del iframe del widget a propósito — es el
    // "Plan C" experimental para geolocalización dentro de Staffbase.
    function send(lat, lng) {
      try {
        if (window.opener) window.opener.postMessage({ type: 'geo-result', lat: lat, lng: lng }, '*');
      } catch (e) {}
      window.close();
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => send(pos.coords.latitude, pos.coords.longitude),
        () => send(null, null),
        { timeout: 6000 }
      );
    } else {
      send(null, null);
    }
  </script>
</body>
</html>
