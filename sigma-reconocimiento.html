<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dar un Reconocimiento</title>
<style>
  /* Paleta Sigma Foods (sigmafoods.com): azul marino #081435 · rojo #D50032 · dorado #FFC72C · crema #EEEEE9 */
  :root {
    --brand: #081435;
    --brand-light: #1F4572;
    --accent: #D50032;
    --gold: #FFC72C;
    --text-dark: #2A2826;
    --text-muted: #575351;
    --border: #E0E0DA;
    --bg-soft: #F6F6F2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: transparent;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 4px 24px rgba(8,20,53,0.10);
    border: 1px solid var(--border);
    padding: 16px;
    max-width: 420px;
    margin: 0 auto;
    overflow: hidden;
  }

  /* ---------- Avatares con iniciales (sin imágenes) ---------- */
  .av {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-weight: 800;
    flex-shrink: 0;
    letter-spacing: 0.02em;
    line-height: 1;
  }

  /* ---------- Header ---------- */
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-dark);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .points-badge {
    background: linear-gradient(135deg, var(--brand), var(--brand-light));
    color: #fff;
    font-size: 11.5px;
    font-weight: 700;
    padding: 6px 11px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* ---------- Search ---------- */
  .field-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: block;
  }
  .search-wrap { position: relative; margin-bottom: 14px; }
  .search-input {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 11px 12px 11px 36px;
    font-size: 14.5px;
    color: var(--text-dark);
    background: var(--bg-soft);
    outline: none;
  }
  .search-input:focus { border-color: var(--brand); background: #fff; }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: 0.45;
    pointer-events: none;
  }
  .dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(8,20,53,0.14);
    overflow: hidden;
    z-index: 20;
    display: none;
  }
  .dropdown.open { display: block; }
  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
  }
  .dropdown-item:hover,
  .dropdown-item:active { background: var(--bg-soft); }
  .dropdown-item + .dropdown-item { border-top: 1px solid var(--border); }
  .dropdown-item .name { font-size: 13.5px; font-weight: 600; color: var(--text-dark); }
  .dropdown-item .role { font-size: 11.5px; color: var(--text-muted); }
  .dropdown-empty { padding: 12px; font-size: 13px; color: var(--text-muted); text-align: center; }

  /* ---------- Selected person chip ---------- */
  .selected-chip {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--bg-soft);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 9px 10px;
    margin-bottom: 14px;
  }
  .selected-chip.open { display: flex; }
  .selected-chip .info { flex: 1; min-width: 0; }
  .selected-chip .name { font-size: 14px; font-weight: 700; color: var(--text-dark); }
  .selected-chip .role { font-size: 11.5px; color: var(--text-muted); }
  .selected-chip .remove {
    background: none; border: none; font-size: 18px; color: var(--text-muted);
    cursor: pointer; padding: 4px 6px; line-height: 1;
  }

  /* ---------- Values selector ---------- */
  .values-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .value-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1.5px solid var(--border);
    background: #fff;
    border-radius: 12px;
    padding: 9px 6px;
    min-height: 52px;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.2;
    text-align: center;
    font-family: inherit;
    color: var(--text-dark);
    cursor: pointer;
  }
  .value-btn .value-icon { font-size: 16px; line-height: 1; flex-shrink: 0; }
  .value-btn.active {
    border-color: var(--brand);
    background: var(--brand);
    color: #fff;
  }

  /* ---------- Message ---------- */
  .message-wrap { margin-bottom: 14px; }
  textarea.message-input {
    width: 100%;
    min-height: 64px;
    resize: none;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--text-dark);
    background: var(--bg-soft);
    outline: none;
    line-height: 1.4;
  }
  textarea.message-input:focus { border-color: var(--brand); background: #fff; }

  /* ---------- Submit ---------- */
  .submit-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 13px 0;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .submit-btn:active { opacity: 0.85; }
  .submit-btn.shake { animation: shake 0.35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  /* ---------- Success state ---------- */
  .success-view {
    display: none;
    text-align: center;
    padding: 10px 4px 4px;
  }
  .success-view.open { display: block; }
  .success-check {
    width: 52px; height: 52px; border-radius: 50%;
    background: #e8f7ee; color: #1a9850;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; margin: 0 auto 10px;
  }
  .success-title { font-size: 16px; font-weight: 700; color: var(--text-dark); margin-bottom: 4px; }
  .success-sub { font-size: 13.5px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.5; }
  .success-sub strong { color: var(--text-dark); }
  .new-balance {
    background: #FFF4D6;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13.5px;
    color: var(--text-dark);
    margin-bottom: 14px;
  }
  .new-balance b { color: var(--brand); font-size: 15px; }
  .again-btn {
    width: 100%;
    background: #fff;
    border: 1.5px solid var(--brand);
    color: var(--brand);
    border-radius: 12px;
    padding: 11px 0;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  .form-view { display: block; }
  .form-view.hidden { display: none; }

  /* ---------- Recent feed ---------- */
  .feed-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .feed-title {
    font-size: 12px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.03em;
    margin-bottom: 8px;
  }
  .feed-list { display: flex; flex-direction: column; gap: 10px; }
  .feed-item { display: flex; align-items: flex-start; gap: 8px; }
  .feed-item .av { margin-top: 1px; }
  .feed-item .feed-text-wrap { flex: 1; min-width: 0; }
  .feed-item .feed-names { font-size: 12px; color: var(--text-dark); line-height: 1.3; }
  .feed-item .feed-names b { font-weight: 700; }
  .feed-item .feed-time-inline { font-size: 11px; color: var(--text-muted); font-weight: 400; }
  .feed-item .feed-message {
    font-size: 11.5px;
    color: var(--text-muted);
    font-style: italic;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .feed-item.new { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="card">

  <div class="header-row">
    <div class="title">🏆 Dar un reconocimiento</div>
    <div class="points-badge" id="pointsBadge">250 pts disponibles</div>
  </div>

  <div class="form-view" id="formView">

    <label class="field-label">¿A quién quieres reconocer?</label>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Escribe un nombre...">
      <div class="dropdown" id="dropdown"></div>
    </div>

    <div class="selected-chip" id="selectedChip">
      <span id="selectedAvatarWrap"></span>
      <div class="info">
        <div class="name" id="selectedName"></div>
        <div class="role" id="selectedRole"></div>
      </div>
      <button class="remove" id="removeSelected" aria-label="Quitar">✕</button>
    </div>

    <label class="field-label">¿Qué valor estás reconociendo?</label>
    <div class="values-grid" id="valuesGrid">
      <button class="value-btn" data-value="actitud"><span class="value-icon">💡</span> Actitud</button>
      <button class="value-btn" data-value="enfoque"><span class="value-icon">🎯</span> Enfoque</button>
      <button class="value-btn" data-value="pasion"><span class="value-icon">❤️</span> Pasión</button>
      <button class="value-btn" data-value="crecimiento"><span class="value-icon">🌱</span> Crecimiento</button>
    </div>

    <label class="field-label">Tu mensaje</label>
    <div class="message-wrap">
      <textarea class="message-input" id="messageInput" placeholder="Escribe un mensaje breve y genuino..."></textarea>
    </div>

    <button class="submit-btn" id="submitBtn">Enviar reconocimiento 🎉</button>
  </div>

  <div class="success-view" id="successView">
    <div class="success-check">✓</div>
    <div class="success-title">¡Reconocimiento enviado!</div>
    <div class="success-sub" id="successSub"></div>
    <div class="new-balance">Tu nuevo saldo es: <b id="newBalanceText"></b></div>
    <button class="again-btn" id="againBtn">Dar otro reconocimiento</button>
  </div>

  <div class="feed-section">
    <div class="feed-title">Reconocimientos recientes</div>
    <div class="feed-list" id="feedList"></div>
  </div>

</div>

<script>
(function() {
  // Datos ficticios para demo. Los avatares son círculos con iniciales (sin imágenes).
  const PEOPLE = [
    { name: "Rodrigo Elizondo", role: "Jefe de Transporte · Logística", color: "#D50032" },
    { name: "Paulina Garza", role: "VP Ejecutiva · Comunicación y Asuntos Corporativos", color: "#081435" },
    { name: "Laura Fernández", role: "Analista de Calidad", color: "#1F4572" },
    { name: "Diego Morales", role: "Supervisor de Línea", color: "#9D2235" },
    { name: "Ana Torres", role: "Coordinadora de RH", color: "#2877B1" },
    { name: "Alejandra González", role: "Supervisora de Línea de Producción", color: "#FFC72C", fg: "#081435", isYou: true }
  ];

  // Los 4 fundamentales de la cultura Sigma (sigmafoods.com > Nuestra gente > Nuestra cultura)
  const VALUE_LABELS = {
    actitudes: "Actitudes y Comportamientos",
    esencialismo: "Esencialismo y Alineación",
    consumidor: "Pasión por el Consumidor",
    talento: "Hacerme Cargo de mi Talento y Evolución"
  };
  const VALUE_ICONS = { actitudes: "💡", esencialismo: "🎯", consumidor: "❤️", talento: "🌱" };

  function initials(name) {
    const parts = name.split(' ').filter(Boolean);
    return ((parts[0] ? parts[0][0] : '') + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }

  // "Tú" en el feed es la persona de demo (Alejandra). Cualquier otro nombre fuera de PEOPLE usa un gris neutro.
  function findPerson(name) {
    if (name === 'Tú') return PEOPLE.find(p => p.isYou);
    return PEOPLE.find(p => p.name === name);
  }

  function avatarHtml(name, size) {
    const person = findPerson(name);
    const bg = person ? person.color : '#575351';
    const fg = person && person.fg ? person.fg : '#ffffff';
    const label = name === 'Tú' && person ? person.name : name;
    return `<span class="av" style="width:${size}px; height:${size}px; font-size:${Math.round(size * 0.36)}px; background:${bg}; color:${fg};">${initials(label)}</span>`;
  }

  const POINTS_TO_GIVE = 5;
  const POINTS_EARNED = POINTS_TO_GIVE * 2;

  let balance = 250;
  let selectedPerson = null;
  let selectedValue = null;

  const searchInput = document.getElementById('searchInput');
  const dropdown = document.getElementById('dropdown');
  const selectedChip = document.getElementById('selectedChip');
  const selectedAvatarWrap = document.getElementById('selectedAvatarWrap');
  const selectedName = document.getElementById('selectedName');
  const selectedRole = document.getElementById('selectedRole');
  const removeSelected = document.getElementById('removeSelected');
  const valueBtns = document.querySelectorAll('.value-btn');
  const messageInput = document.getElementById('messageInput');
  const submitBtn = document.getElementById('submitBtn');
  const formView = document.getElementById('formView');
  const successView = document.getElementById('successView');
  const successSub = document.getElementById('successSub');
  const newBalanceText = document.getElementById('newBalanceText');
  const againBtn = document.getElementById('againBtn');
  const pointsBadge = document.getElementById('pointsBadge');
  const feedList = document.getElementById('feedList');

  const INITIAL_FEED = [
    { name: "María López", target: "Jorge Ramírez", value: "consumidor", points: 5, time: "hace 2 h", message: "Gracias por ir más allá para que el pedido de nuestro cliente llegara a tiempo" },
    { name: "Diego Morales", target: "Ana Torres", value: "esencialismo", points: 5, time: "hace 5 h", message: "Gracias por enfocar la junta en lo importante y alinear a todos los equipos" },
    { name: "Paulina Garza", target: "Rodrigo Elizondo", value: "actitudes", points: 5, time: "ayer", message: "Gracias por mantener una actitud positiva durante el cierre de mes" },
    { name: "Ana Torres", target: "Laura Fernández", value: "talento", points: 5, time: "hace 2 días", message: "Gracias por tomar la iniciativa en tu plan de desarrollo e impulsar a tu equipo" }
  ];

  function renderFeedItem(item, isNew) {
    const el = document.createElement('div');
    el.className = 'feed-item' + (isNew ? ' new' : '');
    const icon = VALUE_ICONS[item.value] || '';
    el.innerHTML = `
      ${avatarHtml(item.name, 22)}
      <div class="feed-text-wrap">
        <div class="feed-names"><b>${item.name}</b> → <b>${item.target}</b> <span class="feed-time-inline">· ${item.time}</span></div>
        <div class="feed-message">${icon} "${item.message}"</div>
      </div>
    `;
    return el;
  }

  function renderFeed() {
    feedList.innerHTML = '';
    INITIAL_FEED.forEach(item => feedList.appendChild(renderFeedItem(item, false)));
  }
  renderFeed();

  function updateBadge() {
    pointsBadge.textContent = `${balance} pts disponibles`;
  }

  function renderDropdown(query) {
    const q = query.trim().toLowerCase();
    if (!q) { dropdown.classList.remove('open'); dropdown.innerHTML = ''; return; }
    const matches = PEOPLE.filter(p => p.name.toLowerCase().includes(q));
    dropdown.innerHTML = '';
    if (matches.length === 0) {
      dropdown.innerHTML = '<div class="dropdown-empty">No se encontró a nadie con ese nombre</div>';
    } else {
      matches.slice(0, 4).forEach(p => {
        const item = document.createElement('div');
        item.className = 'dropdown-item';
        item.innerHTML = `
          ${avatarHtml(p.name, 34)}
          <div>
            <div class="name">${p.name}</div>
            <div class="role">${p.role}</div>
          </div>
        `;
        item.addEventListener('click', () => selectPerson(p));
        dropdown.appendChild(item);
      });
    }
    dropdown.classList.add('open');
  }

  function selectPerson(p) {
    selectedPerson = p;
    selectedAvatarWrap.innerHTML = avatarHtml(p.name, 36);
    selectedName.textContent = p.name;
    selectedRole.textContent = p.role;
    selectedChip.classList.add('open');
    searchInput.value = '';
    dropdown.classList.remove('open');
    dropdown.innerHTML = '';
  }

  removeSelected.addEventListener('click', () => {
    selectedPerson = null;
    selectedChip.classList.remove('open');
  });

  searchInput.addEventListener('input', (e) => renderDropdown(e.target.value));
  searchInput.addEventListener('focus', (e) => { if (e.target.value) renderDropdown(e.target.value); });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) {
      dropdown.classList.remove('open');
    }
  });

  valueBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      valueBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedValue = btn.dataset.value;
    });
  });

  function flashMissing(el) {
    el.style.borderColor = '#D50032';
    setTimeout(() => { el.style.borderColor = ''; }, 900);
  }

  submitBtn.addEventListener('click', () => {
    let valid = true;
    if (!selectedPerson) {
      flashMissing(searchInput);
      valid = false;
    }
    if (!selectedValue) {
      valueBtns.forEach(b => flashMissing(b));
      valid = false;
    }
    if (!messageInput.value.trim()) {
      flashMissing(messageInput);
      valid = false;
    }
    if (!valid) {
      submitBtn.classList.remove('shake');
      void submitBtn.offsetWidth;
      submitBtn.classList.add('shake');
      return;
    }

    balance += POINTS_EARNED;
    updateBadge();

    const firstName = selectedPerson.name.split(' ')[0];
    successSub.innerHTML = `<strong>${selectedPerson.name}</strong> recibió <strong>${POINTS_TO_GIVE} puntos</strong> tuyos por <strong>${VALUE_LABELS[selectedValue]}</strong>, y tú ganaste <strong>${POINTS_EARNED} puntos</strong> por reconocer a ${firstName} 🎉`;
    newBalanceText.textContent = `${balance} puntos`;

    INITIAL_FEED.unshift({ name: "Tú", target: selectedPerson.name, value: selectedValue, points: POINTS_TO_GIVE, time: "ahora", message: messageInput.value.trim() });
    const newItem = renderFeedItem(INITIAL_FEED[0], true);
    feedList.insertBefore(newItem, feedList.firstChild);
    if (feedList.children.length > 4) {
      feedList.removeChild(feedList.lastChild);
    }

    formView.classList.add('hidden');
    successView.classList.add('open');
  });

  againBtn.addEventListener('click', () => {
    selectedPerson = null;
    selectedValue = null;
    selectedChip.classList.remove('open');
    valueBtns.forEach(b => b.classList.remove('active'));
    messageInput.value = '';
    searchInput.value = '';
    successView.classList.remove('open');
    formView.classList.remove('hidden');
  });

  // Report height to Staffbase parent iframe
  function reportHeight() {
    const height = document.body.scrollHeight;
    window.parent.postMessage({ type: 'resize', height: height }, '*');
  }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) {
    new ResizeObserver(reportHeight).observe(document.body);
  }
})();
</script>

</body>
</html>
