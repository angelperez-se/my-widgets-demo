<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="widget-name" content="Sigma Foods - Cumpleaños y Aniversarios del mes (siempre extendido)">
<meta name="widget-description" content="Version movil (iPhone) con pestanas del widget de cumpleanos y aniversarios laborales del mes, con el look and feel de Sigma Foods (azul marino/rojo/dorado). Cumpleanos en orden cronologico, Aniversarios ranqueados por anos de antiguedad con distintivo en anos milestone. El cumpleanos de Alejandra Gonzalez (persona de demo) siempre cae en el dia actual. Datos ficticios para demo.">
<title>Cumpleaños y Aniversarios</title>
<style>
  /* Paleta Sigma Foods (sigmafoods.com): azul marino #081435 · rojo #D50032 · dorado #FFC72C · crema #EEEEE9 */
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

  .ca-outer { max-width: 440px; margin: 0 auto; padding: 10px; }

  .ca-card { background: #ffffff; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 24px rgba(8,20,53,.14); }

  .ca-header { position: relative; overflow: hidden; background: linear-gradient(135deg, #081435 0%, #040C21 100%); padding: 20px 20px 18px; color: #fff; text-align: center; }
  .ca-decor-a { position: absolute; top: -40px; right: -30px; width: 130px; height: 130px; border-radius: 50%; background: rgba(213,0,50,.30); }
  .ca-decor-b { position: absolute; bottom: -50px; left: -30px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,199,44,.10); }

  /* Logo placeholder: ícono + wordmark (sin imágenes) */
  .ca-logo-pill { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 7px; background: #ffffff; border-radius: 8px; padding: 6px 14px; margin-bottom: 12px; }
  .ca-logo-ico { font-size: 15px; line-height: 1; }
  .ca-logo-text { font-size: 14px; font-weight: 800; color: #081435; letter-spacing: -.3px; }

  .ca-eyebrow { position: relative; z-index: 1; font-size: 11px; font-weight: 700; color: rgba(255,255,255,.75); letter-spacing: .3px; margin: 0 0 6px; text-transform: uppercase; }
  .ca-title { position: relative; z-index: 1; font-size: 21px; font-weight: 800; margin: 0 0 4px; }
  .ca-subtitle { position: relative; z-index: 1; font-size: 12.5px; color: rgba(255,255,255,.85); margin: 0; line-height: 1.5; }

  /* Tabs */
  .ca-tabs { display: flex; gap: 6px; padding: 14px 16px 4px; }
  .ca-tab { flex: 1; border: none; background: #EEEEE9; color: #575351; font-size: 12px; font-weight: 700; font-family: inherit; padding: 9px 6px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .ca-tab.active { background: #081435; color: #fff; }

  /* Lista */
  .ca-list { padding: 8px 14px 18px; }
  .ca-row { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid #ECECE6; }
  .ca-row:last-child { border-bottom: none; }
  .ca-rank { width: 20px; text-align: center; font-size: 12px; font-weight: 800; color: #9a9a94; flex-shrink: 0; }
  .ca-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; color: #fff; }
  .ca-row-body { flex: 1; min-width: 0; }
  .ca-row-name-line { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
  .ca-row-name { font-size: 13.5px; font-weight: 700; color: #2A2826; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ca-row-meta { font-size: 12px; color: #575351; }
  .ca-right { flex-shrink: 0; text-align: right; }
  .ca-years { font-size: 15px; font-weight: 800; color: #081435; }
  .ca-years-label { font-size: 9.5px; color: #575351; font-weight: 600; }
  .ca-milestone { display: inline-block; margin-top: 3px; font-size: 9.5px; font-weight: 800; color: #6B4E00; background: #FFF4D6; padding: 2px 7px; border-radius: 8px; }

  .ca-row-you { background: #FFF4D6; border-radius: 10px; margin: 0 -4px; padding: 11px 8px; border-bottom: none !important; }
  .ca-row-you + .ca-row { border-top: 1px solid #ECECE6; }
  .ca-you-badge { font-size: 9px; font-weight: 800; color: #081435; background: #FFC72C; padding: 1px 6px; border-radius: 8px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="ca-outer">

  <div class="ca-card" id="ca-expanded">

    <div class="ca-header">
      <div class="ca-decor-a"></div>
      <div class="ca-decor-b"></div>
      <div class="ca-logo-pill">
        <!-- Para usar el logo real: reemplaza el contenido de este bloque por <img src="URL_DEL_LOGO_SIGMA" alt="Sigma Foods" style="height:20px; display:block;"> subido a Staffbase -->
        <span class="ca-logo-ico">🍽️</span>
        <span class="ca-logo-text">Sigma Foods</span>
      </div>
      <p class="ca-eyebrow" id="ca-month-label">📅 —</p>
      <h1 class="ca-title">Así celebramos este mes</h1>
      <p class="ca-subtitle">Cumpleaños y aniversarios laborales de nuestro equipo</p>
    </div>

    <div class="ca-tabs">
      <button class="ca-tab active" data-tab="bday" id="ca-tab-bday" onclick="setTab('bday', this)">🎂 Cumpleaños</button>
      <button class="ca-tab" data-tab="anniv" id="ca-tab-anniv" onclick="setTab('anniv', this)">🏅 Aniversarios</button>
    </div>

    <div class="ca-list" id="ca-list"></div>

  </div>

</div>

<script>
  // ── Demo conceptual: datos ficticios en memoria, nada se envía ni se guarda.
  const AVATAR_GRAD = 'linear-gradient(135deg,#081435,#1F4572)';

  // Cumpleaños: day = día del mes (se muestra junto al mes actual real).
  // El de Alejandra González (persona de demo) se calcula dinámicamente,
  // asi que siempre cae "hoy", sin importar cuando se abra la demo.
  const BIRTHDAYS = [
    { name: 'Renata Salcido',      day: 3  },
    { name: 'Emilio Torres',       day: 6  },
    { name: 'Ximena Delgado',      day: 9  },
    { name: 'Uriel Castañeda',     day: 12 },
    { name: 'Daniela Ochoa',       day: 15 },
    { name: 'Rodrigo Villaseñor',  day: 19 },
    { name: 'Alejandra González',  day: new Date().getDate(), isYou: true },
    { name: 'Mariana Cabrera',     day: 24 },
    { name: 'Andrés Figueroa',     day: 28 }
  ].sort((a, b) => a.day - b.day);

  // Aniversarios: years = años de antigüedad. Milestone: múltiplos de 5, o el primer año.
  const ANNIVERSARIES = [
    { name: 'Guillermo Peña',        years: 15 },
    { name: 'Leticia Armendáriz',    years: 12 },
    { name: 'Salvador Nieto',        years: 10 },
    { name: 'Itzel Cordero',         years: 8  },
    { name: 'Adrián Zamudio',        years: 5  },
    { name: 'Brenda Solórzano',      years: 3  },
    { name: 'Tomás Herrera',         years: 2  },
    { name: 'Valeria Junco',         years: 1  }
  ].sort((a, b) => b.years - a.years);

  function isMilestone(years) { return years === 1 || years % 5 === 0; }

  let currentTab = 'bday';

  function initials(name) {
    const parts = name.split(' ').filter(Boolean);
    return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase();
  }

  function setTab(tab, btnEl) {
    currentTab = tab;
    document.querySelectorAll('.ca-tab').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
    render();
  }

  function render() {
    const listEl = document.getElementById('ca-list');
    listEl.innerHTML = '';

    if (currentTab === 'bday') {
      BIRTHDAYS.forEach((p, idx) => {
        const monthName = new Intl.DateTimeFormat('es-MX', { month: 'long' }).format(new Date());
        const row = document.createElement('div');
        row.className = 'ca-row' + (p.isYou ? ' ca-row-you' : '');
        row.innerHTML =
          '<div class="ca-rank">' + (idx + 1) + '</div>' +
          '<div class="ca-avatar" style="background:' + AVATAR_GRAD + '">' + initials(p.name) + '</div>' +
          '<div class="ca-row-body">' +
            '<div class="ca-row-name-line">' +
              '<span class="ca-row-name">' + p.name + '</span>' +
              (p.isYou ? '<span class="ca-you-badge">Tú</span>' : '') +
            '</div>' +
            '<div class="ca-row-meta">🎂 ' + p.day + ' de ' + monthName + '</div>' +
          '</div>';
        listEl.appendChild(row);
      });
    } else {
      ANNIVERSARIES.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'ca-row' + (p.isYou ? ' ca-row-you' : '');
        row.innerHTML =
          '<div class="ca-rank">' + (idx + 1) + '</div>' +
          '<div class="ca-avatar" style="background:' + AVATAR_GRAD + '">' + initials(p.name) + '</div>' +
          '<div class="ca-row-body">' +
            '<div class="ca-row-name-line">' +
              '<span class="ca-row-name">' + p.name + '</span>' +
              (p.isYou ? '<span class="ca-you-badge">Tú</span>' : '') +
            '</div>' +
            (isMilestone(p.years) ? '<span class="ca-milestone">🏅 Aniversario especial</span>' : '') +
          '</div>' +
          '<div class="ca-right">' +
            '<div class="ca-years">' + p.years + '</div>' +
            '<div class="ca-years-label">' + (p.years === 1 ? 'año' : 'años') + '</div>' +
          '</div>';
        listEl.appendChild(row);
      });
    }

    reportHeight();
  }

  (function setMonthLabel() {
    const monthName = new Intl.DateTimeFormat('es-MX', { month: 'long' }).format(new Date());
    document.getElementById('ca-month-label').textContent = '📅 ' + monthName.charAt(0).toUpperCase() + monthName.slice(1);
  })();

  function reportHeight() {
    window.parent.postMessage({ type: 'resize', height: document.body.scrollHeight }, '*');
  }
  new ResizeObserver(reportHeight).observe(document.body);
  window.addEventListener('load', () => { render(); reportHeight(); });
</script>

</body>
</html>
